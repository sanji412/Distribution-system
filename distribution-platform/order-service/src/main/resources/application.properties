spring.application.name=order-center

# Server port for order service
server.port=8005

# Nacos service discovery address
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.enabled=${NACOS_DISCOVERY_ENABLED:true}

# Nacos config center address and optional remote config import
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.enabled=${NACOS_CONFIG_ENABLED:true}
spring.config.import=optional:nacos:order-center-dev.properties?server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.profiles.active=dev

# Database connection URL for order data storage
spring.datasource.url=jdbc:mysql://localhost:3307/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Seata AT distributed transaction
seata.enabled=${SEATA_ENABLED:true}
seata.application-id=${spring.application.name}
seata.tx-service-group=distribution_tx_group
seata.service.vgroup-mapping.distribution_tx_group=default
seata.service.grouplist.default=${SEATA_SERVER_ADDR:127.0.0.1:8091}
seata.enable-auto-data-source-proxy=true
seata.data-source-proxy-mode=AT
seata.client.rm.lock.retry-interval=50
seata.client.rm.lock.retry-times=50
seata.client.rm.lock.lock-wait-timeout=30000
seata.client.rm.lock.retry-policy-branch-rollback-on-conflict=true

# Order timeout duration (in minutes, auto-cancel overdue orders)
order.timeout.minutes=30

# Enable order cache (reduce database query pressure)
order.cache.enabled=true

# Order cache expiration time (in seconds)
order.cache.expire.seconds=600

# OpenFeign client logs and timeout settings
logging.level.com.buu.order.client=DEBUG
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# Sentinel protects OpenFeign calls and reports runtime metrics to dashboard
spring.cloud.sentinel.transport.dashboard=${SENTINEL_DASHBOARD:127.0.0.1:8080}
spring.cloud.sentinel.transport.port=8721
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.web-context-unify=false
spring.cloud.sentinel.log.dir=./logs/csp/order-service
feign.sentinel.enabled=true

# DeepSeek chat model through Spring AI OpenAI-compatible client
spring.ai.openai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:sk-placeholder}
spring.ai.openai.chat.options.model=${DEEPSEEK_MODEL:deepseek-chat}
spring.ai.openai.chat.options.temperature=${DEEPSEEK_TEMPERATURE:0.3}

# Mapper XML location for MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
