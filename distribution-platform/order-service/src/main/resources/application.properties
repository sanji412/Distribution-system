spring.application.name=order-center

# Server port for order service
server.port=8005

# Nacos service discovery address
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.enabled=${NACOS_DISCOVERY_ENABLED:true}

# Nacos config center address and optional remote config import
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.enabled=${NACOS_CONFIG_ENABLED:true}
spring.config.import=optional:nacos:order-center-dev.properties?server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.profiles.active=dev

# Database connection URL for order data storage
spring.datasource.url=jdbc:mysql://localhost:3307/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}

# Order timeout duration (in minutes, auto-cancel overdue orders)
order.timeout.minutes=30

# Enable order cache (reduce database query pressure)
order.cache.enabled=true

# Order cache expiration time (in seconds)
order.cache.expire.seconds=600

# OpenFeign client logs and timeout settings
logging.level.com.buu.order.client=DEBUG
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# Mapper XML location for MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
