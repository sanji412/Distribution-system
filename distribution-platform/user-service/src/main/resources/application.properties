spring.application.name=user-center
# Server port for user service (user service listening port)
server.port=8001

# Nacos service discovery address
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.enabled=${NACOS_DISCOVERY_ENABLED:true}

# Nacos config center address and optional remote config import
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.enabled=${NACOS_CONFIG_ENABLED:true}
spring.config.import=optional:nacos:user-center-dev.properties?server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.profiles.active=dev

# Database connection URL for user data storage
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}

# Maximum number of active database connections
spring.datasource.hikari.maximum-pool-size=10

# Timeout for user session (in seconds)
user.session.timeout=1800

# Enable user password encryption (true/false)
user.password.encryption.enabled=true

# Mapper XML location for MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Unified console log format for local and Docker runtime
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n
