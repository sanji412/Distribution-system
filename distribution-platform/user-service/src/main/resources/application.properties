spring.application.name=user-service
# Server port for user service (user service listening port)
server.port=8081

# Database connection URL for user data storage
spring.datasource.url=jdbc:mysql://localhost:3307/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}

# Maximum number of active database connections
spring.datasource.hikari.maximum-pool-size=10

# Timeout for user session (in seconds)
user.session.timeout=1800

# Enable user password encryption (true/false)
user.password.encryption.enabled=true

# Mapper XML location for MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
