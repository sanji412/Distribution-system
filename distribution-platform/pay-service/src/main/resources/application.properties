# ========== Basic Service Configuration ==========
# Service name for service identification
spring.application.name=pay-center
# Service listening port, consistent with the project specification
server.port=8006

# Nacos service discovery address
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.enabled=${NACOS_DISCOVERY_ENABLED:true}

# Nacos config center address and optional remote config import
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.enabled=${NACOS_CONFIG_ENABLED:true}
spring.config.import=optional:nacos:pay-center-dev.properties?server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.profiles.active=dev

# ========== Database Connection Configuration ==========
# MySQL JDBC driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JDBC connection URL for pay database, with time zone and encoding settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/pay_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
# Database login username
spring.datasource.username=root
# Database login password
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}
# Maximum number of active connections in the connection pool
spring.datasource.hikari.maximum-pool-size=10
# Connection wait timeout in milliseconds
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# ========== Seata Distributed Transaction ==========
seata.enabled=${SEATA_ENABLED:true}
seata.application-id=${spring.application.name}
seata.tx-service-group=distribution_tx_group
seata.service.vgroup-mapping.distribution_tx_group=default
seata.service.grouplist.default=${SEATA_SERVER_ADDR:127.0.0.1:8091}
seata.enable-auto-data-source-proxy=true
seata.data-source-proxy-mode=AT
seata.client.rm.lock.retry-interval=50
seata.client.rm.lock.retry-times=50
seata.client.rm.lock.lock-wait-timeout=30000
seata.client.rm.lock.retry-policy-branch-rollback-on-conflict=true

# ========== MyBatis-Plus Configuration ==========
# Mapper XML file scan path
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
# Entity package path for type alias
mybatis-plus.type-aliases-package=com.buu.pay.entity
# Auto map underscore column name to camel case field
mybatis-plus.configuration.map-underscore-to-camel-case=true
# Disable second-level cache
mybatis-plus.configuration.cache-enabled=false
# Database primary key auto increment strategy
mybatis-plus.global-config.db-config.id-type=AUTO

# ========== Business Configuration ==========
# Payment request timeout in milliseconds
payment.request.timeout.ms=5000
# Number of retries for failed payment requests
payment.retry.count=3

# ========== Log Configuration ==========
# Mapper layer log level, print SQL for debugging
logging.level.com.buu.pay.mapper=debug
# Root log level
logging.level.root=info

# Unified console log format for local and Docker runtime
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n
