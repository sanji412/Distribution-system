spring.application.name=product-center
# Server port for product service
server.port=8002

# Nacos service discovery address
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.enabled=${NACOS_DISCOVERY_ENABLED:true}

# Nacos config center address and optional remote config import
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.enabled=${NACOS_CONFIG_ENABLED:true}
spring.config.import=optional:nacos:product-center-dev.properties?server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.profiles.active=dev

# Database connection URL for product data storage
spring.datasource.url=jdbc:mysql://localhost:3307/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}

# Product stock warning threshold (alert when stock is below this value)
product.stock.warning.threshold=10

# Product image storage path
product.image.storage.path=/opt/app/product/images

# Product cache expiration time (in minutes)
product.cache.expire.minutes=30

# Mapper XML location for MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
