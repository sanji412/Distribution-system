spring.application.name=stock-center

# Service listening port
server.port=8003

# Nacos service discovery address
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.enabled=${NACOS_DISCOVERY_ENABLED:true}

# Nacos config center address and optional remote config import
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.enabled=${NACOS_CONFIG_ENABLED:true}
spring.config.import=optional:nacos:stock-center-dev.properties?server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.profiles.active=dev

# ========== Database Configuration ==========
# MySQL database driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC connection URL for stock database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/stock_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}

# Database login username
spring.datasource.username=root

# Database login password
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}

# Max active connections in connection pool
spring.datasource.hikari.maximum-pool-size=10

# Connection wait timeout (milliseconds)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# ========== Seata Distributed Transaction ==========
seata.enabled=${SEATA_ENABLED:true}
seata.application-id=${spring.application.name}
seata.tx-service-group=distribution_tx_group
seata.service.vgroup-mapping.distribution_tx_group=default
seata.service.grouplist.default=${SEATA_SERVER_ADDR:127.0.0.1:8091}
seata.enable-auto-data-source-proxy=true
seata.data-source-proxy-mode=AT
seata.client.rm.lock.retry-interval=50
seata.client.rm.lock.retry-times=50
seata.client.rm.lock.lock-wait-timeout=30000
seata.client.rm.lock.retry-policy-branch-rollback-on-conflict=true

# ========== MyBatis-Plus Configuration ==========
# Mapper XML file scan path
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml

# Entity package for type alias
mybatis-plus.type-aliases-package=com.buu.stock.entity

# Auto map underscore column to camel case field
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Disable second-level cache
mybatis-plus.configuration.cache-enabled=false

# Database primary key auto increment
mybatis-plus.global-config.db-config.id-type=AUTO

# ========== Business Configuration ==========
# Safe stock threshold, trigger warning when stock is lower
stock.safe.threshold=20

# Retry times when stock deduction fails
stock.deduct.retry.times=3

# Enable stock operation log record
stock.operation.log.enable=true

# ========== Sentinel Configuration ==========
# Sentinel dashboard address
spring.cloud.sentinel.transport.dashboard=${SENTINEL_DASHBOARD:127.0.0.1:8080}

# Sentinel client command port, keep unique among dashboard and local services
spring.cloud.sentinel.transport.port=8720

# Register Sentinel rules eagerly after service startup
spring.cloud.sentinel.eager=true

# Separate web resource context for clearer controller resource statistics
spring.cloud.sentinel.web-context-unify=false

# Sentinel runtime log directory
spring.cloud.sentinel.log.dir=./logs/csp/stock-service

# ========== Log Configuration ==========
# Mapper layer log level (debug for SQL print)
logging.level.com.buu.stock.mapper=debug

# Root log level
logging.level.root=info

# Unified console log format for local and Docker runtime
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n

# Log file output path
logging.file.name=./logs/stock-service.log
