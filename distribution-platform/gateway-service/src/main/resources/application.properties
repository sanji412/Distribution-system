spring.application.name=gateway-service

# Server port for the unified gateway entry
server.port=9000

# Nacos service discovery address
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.enabled=${NACOS_DISCOVERY_ENABLED:true}

# Nacos config center address and optional remote YAML config import
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.enabled=${NACOS_CONFIG_ENABLED:true}
spring.config.import=optional:nacos:gateway-service-dev.yml?server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.profiles.active=dev

# User service route
spring.cloud.gateway.routes[0].id=user_route
spring.cloud.gateway.routes[0].uri=lb://user-center
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**

# Product service route
spring.cloud.gateway.routes[1].id=product_route
spring.cloud.gateway.routes[1].uri=lb://product-center
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/product/**

# Stock service route
spring.cloud.gateway.routes[2].id=stock_route
spring.cloud.gateway.routes[2].uri=lb://stock-center
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/stock/**

# Order service route
spring.cloud.gateway.routes[3].id=order_route
spring.cloud.gateway.routes[3].uri=lb://order-center
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/order/**

# Pay service route
spring.cloud.gateway.routes[4].id=pay_route
spring.cloud.gateway.routes[4].uri=lb://pay-center
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/pay/**

# Auth service route
spring.cloud.gateway.routes[5].id=auth_route
spring.cloud.gateway.routes[5].uri=lb://auth-center
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/auth/**

# JWT unified authentication
jwt.secret=${JWT_SECRET:distribution-platform-local-jwt-secret}
jwt.issuer=distribution-platform

# Global CORS configuration for Vue frontend and API debugging tools
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
