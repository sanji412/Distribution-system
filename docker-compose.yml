name: distribution-system

x-backend-env: &backend-env
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-distribution_root_123}
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_DISCOVERY_ENABLED: "true"
  NACOS_CONFIG_ENABLED: "false"
  JWT_SECRET: ${JWT_SECRET:-distribution-platform-change-me-to-a-long-random-secret}
  TZ: Asia/Shanghai

x-backend-common: &backend-common
  restart: unless-stopped
  environment:
    <<: *backend-env
  networks:
    - distribution-net

x-java-build: &java-build
  context: .
  dockerfile: distribution-platform/Dockerfile

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: distribution-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-distribution_root_123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./distribution-platform/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - distribution-net

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: distribution-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - distribution-net

  nacos:
    image: docker.m.daocloud.io/nacos/nacos-server:v2.3.2
    platform: linux/amd64
    container_name: distribution-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "${NACOS_HOST_PORT:-8848}:8848"
      - "${NACOS_GRPC_HOST_PORT:-9848}:9848"
    networks:
      - distribution-net

  seata:
    image: docker.m.daocloud.io/seataio/seata-server:1.7.1
    platform: linux/amd64
    container_name: distribution-seata
    restart: unless-stopped
    environment:
      SEATA_IP: seata
      SEATA_PORT: 8091
      STORE_MODE: file
    ports:
      - "${SEATA_CONSOLE_HOST_PORT:-7091}:7091"
      - "${SEATA_HOST_PORT:-8091}:8091"
    networks:
      - distribution-net

  user-service:
    <<: *backend-common
    container_name: distribution-user-service
    build:
      <<: *java-build
      args:
        MODULE: user-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    ports:
      - "${USER_SERVICE_HOST_PORT:-8001}:8001"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started

  product-service:
    <<: *backend-common
    container_name: distribution-product-service
    build:
      <<: *java-build
      args:
        MODULE: product-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    ports:
      - "${PRODUCT_SERVICE_HOST_PORT:-8002}:8002"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started

  stock-service:
    <<: *backend-common
    container_name: distribution-stock-service
    build:
      <<: *java-build
      args:
        MODULE: stock-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/stock_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
      SEATA_ENABLED: "true"
      SEATA_SERVER_ADDR: seata:8091
    ports:
      - "${STOCK_SERVICE_HOST_PORT:-8003}:8003"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      seata:
        condition: service_started

  pay-service:
    <<: *backend-common
    container_name: distribution-pay-service
    build:
      <<: *java-build
      args:
        MODULE: pay-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pay_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
      SEATA_ENABLED: "true"
      SEATA_SERVER_ADDR: seata:8091
    ports:
      - "${PAY_SERVICE_HOST_PORT:-8006}:8006"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      seata:
        condition: service_started

  order-service:
    <<: *backend-common
    container_name: distribution-order-service
    build:
      <<: *java-build
      args:
        MODULE: order-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
      SEATA_ENABLED: "true"
      SEATA_SERVER_ADDR: seata:8091
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-placeholder}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TEMPERATURE: ${DEEPSEEK_TEMPERATURE:-0.3}
    ports:
      - "${ORDER_SERVICE_HOST_PORT:-8005}:8005"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      seata:
        condition: service_started
      product-service:
        condition: service_started
      stock-service:
        condition: service_started
      pay-service:
        condition: service_started

  auth-service:
    <<: *backend-common
    container_name: distribution-auth-service
    build:
      <<: *java-build
      args:
        MODULE: auth-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-8007}:8007"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started

  gateway-service:
    <<: *backend-common
    container_name: distribution-gateway-service
    build:
      <<: *java-build
      args:
        MODULE: gateway-service
    ports:
      - "${GATEWAY_HOST_PORT:-9000}:9000"
    depends_on:
      nacos:
        condition: service_started
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      stock-service:
        condition: service_started
      order-service:
        condition: service_started
      pay-service:
        condition: service_started
      auth-service:
        condition: service_started

  frontend:
    container_name: distribution-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - distribution-net

volumes:
  mysql-data:

networks:
  distribution-net:
    driver: bridge
