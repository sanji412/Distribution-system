spring.application.name=user-service
# Server port for user service (user service listening port)
server.port=8081

# Database connection URL for user data storage
spring.datasource.url=jdbc:mysql://localhost:3306/user_db?useSSL=false&serverTimezone=UTC

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=root

# Maximum number of active database connections
spring.datasource.hikari.maximum-pool-size=10

# Timeout for user session (in seconds)
user.session.timeout=1800

# Enable user password encryption (true/false)
user.password.encryption.enabled=true