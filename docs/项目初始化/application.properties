# ===============================
# Server Basic Configuration
# ===============================
# Application running port
server.port=8080
# ===============================
# MySQL DataSource Configuration
# ===============================
# JDBC connection URL, modify database name/ip/port as your environment
spring.datasource.url=jdbc:mysql://localhost:3306/distribution_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
# Database username
spring.datasource.username=root
# Database password
spring.datasource.password=root
# MySQL 8.x driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# MyBatis-Plus Configuration
# ===============================
# Mapper XML file location
mybatis-plus.mapper-locations=classpath:mapper/*.xml
# Entity class package for type alias
mybatis-plus.type-aliases-package=com.buu.wos.entity
# Auto map underscore column name to camel case field name
mybatis-plus.configuration.map-underscore-to-camel-case=true
# Print SQL log to console for debug
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# Global primary key strategy: use database auto increment
mybatis-plus.global-config.db-config.id-type=auto
