spring.application.name=stock-service

# Service listening port
server.port=8083

# ========== Database Configuration ==========
# MySQL database driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC connection URL for stock database
spring.datasource.url=jdbc:mysql://localhost:3306/stock_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8

# Database login username
spring.datasource.username=root

# Database login password
spring.datasource.password=root

# Max active connections in connection pool
spring.datasource.hikari.maximum-pool-size=10

# Connection wait timeout (milliseconds)
spring.datasource.hikari.connection-timeout=30000

# ========== MyBatis-Plus Configuration ==========
# Mapper XML file scan path
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml

# Entity package for type alias
mybatis-plus.type-aliases-package=com.buu.stock.entity

# Auto map underscore column to camel case field
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Disable second-level cache
mybatis-plus.configuration.cache-enabled=false

# Database primary key auto increment
mybatis-plus.global-config.db-config.id-type=AUTO

# ========== Business Configuration ==========
# Safe stock threshold, trigger warning when stock is lower
stock.safe.threshold=20

# Retry times when stock deduction fails
stock.deduct.retry.times=3

# Enable stock operation log record
stock.operation.log.enable=true

# ========== Log Configuration ==========
# Mapper layer log level (debug for SQL print)
logging.level.com.buu.stock.mapper=debug

# Root log level
logging.level.root=info

# Log file output path
logging.file.name=./logs/stock-service.log